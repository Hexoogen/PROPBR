[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "propbr"
version = "0.1.0"
description = "Differentiable PROPBR and sPROPBR leaf reflectance models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
dependencies = ["numpy>=1.24,<3", "torch>=2.1,<3", "scipy>=1.11,<2", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
full = ["SALib>=1.5,<2"]
dev = ["pytest>=8,<9", "prosail==2.0.5", "build>=1,<2"]

[project.scripts]
propbr = "propbr.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "licenses/*.txt", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
propbr = ["assets/*.npy", "assets/*.pt", "assets/*.txt", "assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
